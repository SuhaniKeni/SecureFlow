services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: secureflow-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - DATABASE_URL=sqlite:///./data/secureflow.db
      - CORS_ORIGINS=*
    volumes:
      - secureflow-db-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - secureflow-net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: secureflow-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost/nginx-health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - secureflow-net

networks:
  secureflow-net:
    driver: bridge

volumes:
  secureflow-db-data:
